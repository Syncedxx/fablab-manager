<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários - FabLab Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-50 text-slate-800 antialiased font-sans">
    <main>
        <div id="geral" class="flex min-h-screen">
            <!-- Barra Lateral: montada pelo menu.js conforme o perfil -->
            <aside id="barraLateral"></aside>

            <div id="painelDireita" class="flex-1 p-8 flex flex-col gap-6">

                <!-- Cabeçalho -->
                <header class="flex justify-between items-center pb-4 border-b border-slate-200">
                    <div class="flex flex-col gap-0.5">
                        <p class="text-[10px] font-bold text-blue-600 uppercase tracking-wider">ADMINISTRAÇÃO</p>
                        <h2 class="text-2xl font-bold text-slate-900">Usuários</h2>
                        <p class="text-xs text-slate-500">Gerencie quem acessa o sistema e com qual perfil.</p>
                    </div>

                    <div>
                        <button type="button" onclick="document.getElementById('modalUsuario').classList.replace('hidden', 'flex')"
                            class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2 rounded-xl">
                            + Novo usuário
                        </button>
                    </div>
                </header>

                <!-- Busca e filtro -->
                <div id="conteudoUsuariosPrincipal" class="flex gap-3">
                    <input id="busca" type="search" placeholder="Buscar por nome ou e-mail..."
                        class="flex-1 px-4 py-2 bg-white border border-slate-200 rounded-xl text-sm text-slate-700 placeholder-slate-400 outline-none focus:border-blue-500">
                    <select id="selecao"
                        class="px-4 py-2 bg-white border border-slate-200 rounded-xl text-sm text-slate-700 outline-none focus:border-blue-500">
                        <option value="">Todos os perfis</option>
                        <option value="aluno">Aluno</option>
                        <option value="instrutor">Professor(a)</option>
                        <option value="administrador">Administrador(a)</option>
                    </select>
                </div>

                <!-- Tabela de Usuários: linhas desenhadas pelo script lá embaixo -->
                <div class="bg-white border border-slate-200 rounded-2xl overflow-hidden">
                    <table class="w-full text-left text-sm border-collapse">
                        <thead class="text-[11px] font-bold text-slate-400 uppercase tracking-wider border-b border-slate-100">
                            <tr>
                                <th class="py-4 px-6">Usuário</th>
                                <th class="py-4 px-6 text-center">Perfil</th>
                                <th class="py-4 px-6 text-center">Status</th>
                                <th class="py-4 px-6 text-right">Ação</th>
                            </tr>
                        </thead>
                        <tbody id="listaUsuarios" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Popup: novo usuário -->
    <div id="modalUsuario"
        class="hidden fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl p-6 flex flex-col gap-4">

            <!-- Cabeçalho -->
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <div>
                    <h3 class="font-bold text-slate-900 text-sm">Novo usuário</h3>
                    <p class="text-[11px] text-slate-400">Informe os dados e escolha o perfil de acesso.</p>
                </div>
                <!-- Botão fechar -->
                <button type="button" onclick="document.getElementById('modalUsuario').classList.replace('flex', 'hidden')"
                    class="text-slate-400 hover:text-slate-700 text-sm font-bold p-1">
                    ✕
                </button>
            </div>

            <!-- Formulário -->
            <form id="formUsuario" class="flex flex-col gap-3">
                <div class="flex flex-col gap-1">
                    <label for="campoNome" class="text-xs font-semibold text-slate-700">Nome</label>
                    <input id="campoNome" type="text" required
                        class="w-full border border-slate-200 rounded-lg p-2 text-xs outline-none focus:ring-2 focus:ring-blue-600">
                </div>
                <div class="flex flex-col gap-1">
                    <label for="campoEmail" class="text-xs font-semibold text-slate-700">E-mail</label>
                    <input id="campoEmail" type="email" required
                        class="w-full border border-slate-200 rounded-lg p-2 text-xs outline-none focus:ring-2 focus:ring-blue-600">
                </div>
                <div class="flex flex-col gap-1">
                    <label for="campoPerfil" class="text-xs font-semibold text-slate-700">Perfil</label>
                    <select id="campoPerfil"
                        class="w-full border border-slate-200 rounded-lg p-2 text-xs outline-none focus:ring-2 focus:ring-blue-600">
                        <option value="aluno">Aluno</option>
                        <option value="instrutor">Professor(a)</option>
                        <option value="administrador">Administrador(a)</option>
                    </select>
                </div>

                <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
                    <button type="button" onclick="document.getElementById('modalUsuario').classList.replace('flex', 'hidden')"
                        class="px-3 py-2 rounded-lg border border-slate-200 text-xs text-slate-600 hover:bg-slate-50 font-medium">
                        Cancelar
                    </button>
                    <button type="submit"
                        class="px-3 py-2 rounded-lg bg-blue-600 text-white text-xs font-semibold hover:bg-blue-700">
                        Cadastrar
                    </button>
                </div>
            </form>
        </div>
    </div>

<script src="menu.js"></script>
<script>
    // dados de exemplo (depois vêm do sistema)
    var usuarios = [
        { nome: 'Ana Souza', email: 'ana.souza@senai.br', perfil: 'aluno', ativo: true },
        { nome: 'João Pereira', email: 'joao.pereira@senai.br', perfil: 'aluno', ativo: true },
        { nome: 'Pedro Santos', email: 'pedro.santos@senai.br', perfil: 'aluno', ativo: false },
        { nome: 'Carlos Lima', email: 'carlos.lima@senai.br', perfil: 'instrutor', ativo: true },
        { nome: 'Marina Alves', email: 'marina.alves@senai.br', perfil: 'administrador', ativo: true }
    ];

    // nome e cor do selo de cada perfil
    var perfis = {
        aluno: { nome: 'Aluno', cor: 'text-slate-600 bg-slate-100' },
        instrutor: { nome: 'Professor(a)', cor: 'text-blue-600 bg-blue-50' },
        administrador: { nome: 'Administrador(a)', cor: 'text-violet-600 bg-violet-50' }
    };

    var lista = document.getElementById('listaUsuarios');
    var busca = document.getElementById('busca');
    var selecao = document.getElementById('selecao');

    // evita que texto digitado vire HTML na tela
    function limpar(texto) {
        return texto.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // primeira letra do primeiro e do último nome (Ana Souza -> AS)
    function iniciais(nome) {
        var partes = nome.trim().split(' ');
        var letras = partes[0].charAt(0);
        if (partes.length > 1) letras += partes[partes.length - 1].charAt(0);
        return letras.toUpperCase();
    }

    // monta a tabela na tela, respeitando a busca e o filtro
    function desenhar() {
        var texto = busca.value.toLowerCase();
        var html = '';

        for (var i = 0; i < usuarios.length; i++) {
            var u = usuarios[i];
            var achou = (u.nome + ' ' + u.email).toLowerCase().indexOf(texto) !== -1;
            var perfilOk = selecao.value === '' || u.perfil === selecao.value;
            if (!achou || !perfilOk) continue;

            var p = perfis[u.perfil];
            html += '<tr class="hover:bg-slate-50/50">' +
                '<td class="py-4 px-6 flex items-center gap-3 font-semibold text-slate-800">' +
                '<div class="size-8 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center shrink-0 text-xs font-bold">' + iniciais(u.nome) + '</div>' +
                '<div class="flex flex-col"><span>' + limpar(u.nome) + '</span><span class="text-[11px] font-normal text-slate-400">' + limpar(u.email) + '</span></div>' +
                '</td>' +
                '<td class="py-4 px-6 text-center"><span class="inline-block px-3 py-1 text-xs font-semibold rounded-full ' + p.cor + '">' + p.nome + '</span></td>' +
                '<td class="py-4 px-6 text-center">' +
                (u.ativo
                    ? '<span class="inline-block px-3 py-1 text-xs font-semibold text-emerald-600 bg-emerald-50 rounded-full">Ativo</span>'
                    : '<span class="inline-block px-3 py-1 text-xs font-semibold text-rose-500 bg-rose-50 rounded-full">Inativo</span>') +
                '</td>' +
                '<td class="py-4 px-6 text-right"><button type="button" data-i="' + i + '" class="text-xs font-semibold text-blue-600 hover:underline">' + (u.ativo ? 'Desativar' : 'Ativar') + '</button></td>' +
                '</tr>';
        }

        if (html === '') {
            html = '<tr><td colspan="4" class="py-10 text-center text-sm text-slate-400">Nenhum usuário encontrado.</td></tr>';
        }
        lista.innerHTML = html;
    }

    // ativa ou desativa o usuário da linha clicada
    lista.addEventListener('click', function (e) {
        var botao = e.target.closest('button[data-i]');
        if (!botao) return;
        var u = usuarios[botao.dataset.i];
        u.ativo = !u.ativo;
        desenhar();
    });

    // cadastra o novo usuário, fecha o popup e redesenha
    document.getElementById('formUsuario').addEventListener('submit', function (e) {
        e.preventDefault();
        usuarios.push({
            nome: document.getElementById('campoNome').value,
            email: document.getElementById('campoEmail').value,
            perfil: document.getElementById('campoPerfil').value,
            ativo: true
        });
        this.reset();
        document.getElementById('modalUsuario').classList.replace('flex', 'hidden');
        desenhar();
    });

    busca.addEventListener('input', desenhar);
    selecao.addEventListener('change', desenhar);
    desenhar();
</script>
</body>

</html>
